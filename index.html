<!DOCTYPE html>

<head>

    <meta name="author" content="José Luis Benito Andújar">
    <meta name="robots" content="noindex, nofollow">

     <meta property="og:title" content="La etiquetas video, audio e iframe">

    <title>Multimedia</title>
    <link rel="icon" href="media/televisor.jpg">
</head>
<body>
    <h1>Video</h1>
    <video width="300" poster="media/televisor.jpg" 
    loop controls src="media/Publicar20s.mp4">
    </video>
    <h1>Audio</h1>
    <audio src="media/audio.mp3" controls>     
    </audio>
    <h1>Periódicos del dia</h1>
    <iframe src="http://www.marca.com" height="400" width="400"   frameborder="1"></iframe>
    <iframe src="http://www.elmundo.es" height="400" width="400" frameborder="1"></iframe>

    <h1>Video de Youtube</h1>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/qhXUHkhzqb0?si=RjIyralf9Bvusglt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

<iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d12334.02778422155!2d-3.228199354964819!3d39.390035591928076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sies%20juan%20bosco!5e0!3m2!1ses!2ses!4v1762248904107!5m2!1ses!2ses" width="400" height="300" style="border: 1px solid red;;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
